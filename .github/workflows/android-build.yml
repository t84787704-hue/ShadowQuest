name: Build Blaze Adventure APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        if: hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js Environment
        if: hashFiles('bun.lock') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Build Web Game Production Bundle
        run: |
          if [ -f bun.lock ]; then
            bun run build
          else
            npm run build
          fi

      - name: Copy Web Dist Assets to Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Valid Gradle Wrapper
        run: |
          cd android
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Downloading official Gradle 8.5 wrapper JAR..."
            mkdir -p gradle/wrapper
            curl -sSL -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/gradle-8.5-bin.zip gradle-8.5/lib/plugins/gradle-wrapper-8.5.jar -d /tmp/gradle-extract
            mv /tmp/gradle-extract/gradle-8.5/lib/plugins/gradle-wrapper-8.5.jar gradle/wrapper/gradle-wrapper.jar
            rm -rf /tmp/gradle-8.5-bin.zip /tmp/gradle-extract
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazeAdventure-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
