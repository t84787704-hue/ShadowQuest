name: Build Blaze Adventure APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        if: hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js Environment
        if: hashFiles('bun.lock') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Build Web Game Production Bundle
        run: |
          if [ -f bun.lock ]; then
            bun run build
          else
            npm run build
          fi

      - name: Copy Web Dist Assets to Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Valid Gradle Wrapper
        run: |
          cd android
          python3 -c "
          import os, zipfile, io, urllib.request

          jar_path = 'gradle/wrapper/gradle-wrapper.jar'
          needs_download = False

          if not os.path.exists(jar_path) or os.path.getsize(jar_path) == 0:
              needs_download = True
          else:
              try:
                  with zipfile.ZipFile(jar_path, 'r') as z:
                      names = z.namelist()
                      if 'org/gradle/wrapper/GradleWrapperMain.class' not in names or 'org/gradle/wrapper/IDownload.class' not in names:
                          needs_download = True
              except Exception as e:
                  needs_download = True

          if needs_download:
              print('Downloading and assembling complete Gradle 8.5 wrapper JAR...')
              url = 'https://services.gradle.org/distributions/gradle-8.5-bin.zip'
              data = urllib.request.urlopen(url).read()
              z = zipfile.ZipFile(io.BytesIO(data))
              
              shared_bytes = z.read('gradle-8.5/lib/gradle-wrapper-shared-8.5.jar')
              wrapper_bytes = z.read('gradle-8.5/lib/plugins/gradle-wrapper-8.5.jar')

              z_shared = zipfile.ZipFile(io.BytesIO(shared_bytes))
              z_wrapper = zipfile.ZipFile(io.BytesIO(wrapper_bytes))

              out_buffer = io.BytesIO()
              with zipfile.ZipFile(out_buffer, 'w', zipfile.ZIP_DEFLATED) as z_out:
                  added = set()
                  for z_src in [z_wrapper, z_shared]:
                      for item in z_src.infolist():
                          if item.filename not in added and not item.filename.startswith('META-INF/MANIFEST'):
                              added.add(item.filename)
                              z_out.writestr(item, z_src.read(item.filename))

              os.makedirs('gradle/wrapper', exist_ok=True)
              with open(jar_path, 'wb') as f:
                  f.write(out_buffer.getvalue())
              print('Successfully updated wrapper JAR! Size:', os.path.getsize(jar_path))
          "
          chmod +x gradlew
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazeAdventure-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
